name: Forum Watcher

on:
  schedule:
    # Alle 5 Minuten. GitHub garantiert das Intervall nicht exakt,
    # kleine Verzoegerungen (paar Minuten) sind normal.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # erlaubt manuellen Start über den "Run workflow" Button

permissions:
  contents: write  # noetig, damit der Bot seen_threads.json zurueck committen darf

jobs:
  check-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Forum prüfen
        env:
          FORUM_URL: "https://forum.gta5majestic.com/forums/beschwerden-uber-spieler.88/"
          FORUM_LOGIN_URL: "https://forum.gta5majestic.com/login/"
          FORUM_USERNAME: ${{ secrets.FORUM_USERNAME }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python forum_watcher.py

      - name: Neuen Zustand speichern (falls geändert)
        run: |
          git config user.name "forum-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          # git add zuerst, damit auch eine NEUE (bisher ungetrackte) Datei
          # erkannt wird - git diff allein uebersieht neue Dateien.
          git add seen_threads.json
          if git diff --cached --quiet; then
            echo "Keine Änderung am Zustand."
          else
            git commit -m "Zustand aktualisieren [skip ci]"
            git push
          fi
